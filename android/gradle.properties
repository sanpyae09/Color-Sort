org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
# NOTE: preferIPv4Stack is required on this build VM — without it the Gradle
# daemon binds an IPv6-mapped ::ffff:127.0.0.1 socket whose loopback traffic
# gets routed out via the container veth and RST, so every build fails with
# "Could not dispatch a message to the daemon / Broken pipe". 2G heap fits
# this 6GB box (the template 8G default starves it).
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
