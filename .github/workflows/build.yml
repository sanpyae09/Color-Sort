name: Build QuizNova APK

on:
  push:
    branches: [quiznova]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Decode image assets (base64 -> files)
        run: |
          mkdir -p assets/images
          for f in assets_b64/*.b64; do
            out="assets/images/$(basename "$f" .b64)"
            base64 -d "$f" > "$out"
            echo "decoded $out ($(stat -c%s "$out") bytes)"
          done

      - name: Scaffold android project (template from installed Flutter)
        run: |
          flutter create --project-name quiznova --org com.pyaystudios --platforms android scaffold_tmp
          cp -r scaffold_tmp/android android
          rm -rf scaffold_tmp

      - name: Patch scaffold (applicationId, minSdk, AdMob test id)
        run: python3 ci/post_scaffold.py

      - name: Pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK (debug-signed test build)
        run: flutter build apk --release

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk quiznova-mvp.apk
          ls -la quiznova-mvp.apk
          gh release view quiznova-mvp >/dev/null 2>&1 || gh release create quiznova-mvp --title "QuizNova MVP (test build)" --notes "Automated test build from the quiznova branch. TEST AdMob IDs only."
          gh release upload quiznova-mvp quiznova-mvp.apk --clobber

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: quiznova-mvp-apk
          path: quiznova-mvp.apk
